# SFL Planner — deploy no Netlify.
# O site e estatico (site/) e os endpoints /api/* sao servidos pela funcao
# netlify/functions/api.mjs, que substitui o proxy do server.py.
#
# A rota /api/* e declarada na propria funcao (export const config), por isso
# aqui nao ha redirects.
#
# Antes do primeiro deploy, define no painel do Netlify:
#   Project configuration > Environment variables > SFL_API_KEY = a tua API key

[build]
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
