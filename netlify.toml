# SFL Planner — deploy no Netlify.
# O site e estatico (site/) e os endpoints /api/* sao servidos pela funcao
# netlify/functions/api.mjs, que substitui o proxy do server.py.
#
# Antes do primeiro deploy, define no painel do Netlify:
#   Site configuration > Environment variables > SFL_API_KEY = a tua API key

[build]
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Mantem os mesmos caminhos do server.py, para o site/js/api.js nao mudar.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
